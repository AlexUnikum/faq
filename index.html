<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ · Шмурдяк</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <meta name="description" content="Часто задаваемые вопросы о разработке сайтов, ценах, сроках и условиях работы со Шмурдяком." />
    <meta property="og:title" content="FAQ — Шмурдяк" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg: #080606;
            --bg-gradient: radial-gradient(ellipse at 20% 40%, #1a0e0c, #080606 90%);
            --bg-card: rgba(14, 10, 10, 0.6);
            --bg-card-hover: rgba(14, 10, 10, 0.8);
            --border: #1e1210;
            --border-hover: #ff3b00;
            --text: #ddd;
            --text-primary: #f0e0e0;
            --text-secondary: #b0a0a0;
            --text-muted: #4a3a3a;
            --text-link: #6a5a5a;
            --accent: #ff3b00;
            --accent-shadow: rgba(255, 59, 0, 0.25);
            --radius: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 30px 20px;
            color: var(--text);
            background-image: var(--bg-gradient);
            display: flex;
            justify-content: center;
        }

        .wrap {
            max-width: 820px;
            width: 100%;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .fade-item {
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #eee;
        }
        .logo span {
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-shadow);
        }

        .nav {
            display: flex;
            gap: 24px;
        }
        .nav a {
            color: var(--text-link);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
        }
        .nav a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ===== ГЕРОЙ ===== */
        .hero {
            padding: 36px 0 20px;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .hero h1 span {
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-shadow);
        }
        .hero .sub {
            font-size: 17px;
            color: var(--text-secondary);
            font-weight: 300;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            margin-top: 4px;
        }
        .hero .sub span {
            color: var(--accent);
        }

        /* ===== ПОИСК ===== */
        .search-wrap {
            margin: 24px 0 28px;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            outline: none;
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .search-wrap input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 30px var(--accent-shadow);
        }

        /* ===== КАТЕГОРИИ ===== */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }
        .category-tab {
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(2px);
        }
        .category-tab:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }
        .category-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
            font-weight: 600;
            box-shadow: 0 0 30px var(--accent-shadow);
        }

        /* ===== FAQ СПИСОК ===== */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }

        .faq-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            backdrop-filter: blur(2px);
        }

        .faq-item:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 30px var(--accent-shadow);
        }

        .faq-item.active {
            border-color: var(--border-hover);
            box-shadow: 0 0 40px var(--accent-shadow);
        }

        .faq-question {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
        }

        .faq-question:hover {
            background: rgba(255, 59, 0, 0.03);
        }

        .faq-question .q-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .faq-question .q-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .faq-question .q-arrow {
            font-size: 14px;
            color: var(--accent);
            transition: transform var(--transition);
            flex-shrink: 0;
        }

        .faq-item.active .faq-question .q-arrow {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 20px;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
        }

        .faq-item.active .faq-answer {
            max-height: 600px;
            padding: 0 20px 20px 20px;
        }

        .faq-answer a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent);
            transition: var(--transition);
        }
        .faq-answer a:hover {
            border-bottom: 1px solid var(--accent);
        }

        .faq-empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 17px;
        }

        /* ===== CTA ===== */
        .cta-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-align: center;
            backdrop-filter: blur(4px);
            margin: 10px 0 40px;
            transition: var(--transition);
        }
        .cta-block:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 40px var(--accent-shadow);
        }
        .cta-block p {
            font-size: 17px;
            color: var(--text-secondary);
        }
        .cta-block a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dashed var(--accent);
            transition: var(--transition);
        }
        .cta-block a:hover {
            border-bottom: 1px solid var(--accent);
        }

        /* ===== ФУТЕР ===== */
        .footer {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--text-link);
            text-decoration: none;
            transition: var(--transition);
        }
        .footer a:hover {
            color: var(--accent);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero h1 {
                font-size: 26px;
            }
            .faq-question .q-text {
                font-size: 15px;
            }
            .faq-answer {
                font-size: 14px;
            }
            .category-tab {
                font-size: 13px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="wrap">

        <!-- ===== ХЕДЕР ===== -->
        <header class="header fade-item" style="animation-delay: 0.1s;">
            <div class="logo">Шмурдяк <span>·</span> FAQ</div>
            <nav class="nav">
                <a href="https://alexunikum.github.io/shmurdyak-main-site/" target="_blank" rel="noopener noreferrer">Визитка</a>
                <a href="https://alexunikum.github.io/shmurdyak-services/" target="_blank" rel="noopener noreferrer">Услуги</a>
            </nav>
        </header>

        <!-- ===== ГЕРОЙ ===== -->
        <section class="hero">
            <h1 class="fade-item" style="animation-delay: 0.15s;">📋 Часто задаваемые <span>вопросы</span></h1>
            <div class="sub fade-item" style="animation-delay: 0.2s;">
                Коротко и по делу — <span>чтобы ты сразу понимал</span>, как мы работаем
            </div>
        </section>

        <!-- ===== ПОИСК ===== -->
        <div class="search-wrap fade-item" style="animation-delay: 0.25s;">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по вопросам..." />
        </div>

        <!-- ===== КАТЕГОРИИ ===== -->
        <div class="category-tabs fade-item" style="animation-delay: 0.3s;" id="categoryTabs">
            <button class="category-tab active" data-category="all">Все</button>
            <button class="category-tab" data-category="price">💰 Цены</button>
            <button class="category-tab" data-category="time">⏱️ Сроки</button>
            <button class="category-tab" data-category="tech">🛠️ Техника</button>
            <button class="category-tab" data-category="order">📞 Заказ</button>
        </div>

        <!-- ===== FAQ СПИСОК ===== -->
        <div class="faq-list" id="faqList">
            <!-- данные вставляются через JS -->
        </div>

        <!-- ===== CTA ===== -->
        <div class="cta-block fade-item" style="animation-delay: 0.5s;">
            <p>❓ Не нашёл ответа? <a href="https://alexunikum.github.io/shmurdyak-main-site/" target="_blank" rel="noopener noreferrer">Напиши</a> — отвечу в течение часа.</p>
        </div>

        <!-- ===== ФУТЕР ===== -->
        <footer class="footer fade-item" style="animation-delay: 0.55s;">
            <p>сделано <a href="https://alexunikum.github.io/shmurdyak-main-site/" target="_blank" rel="noopener noreferrer">Шмурдяком</a> — все работы индивидуальны</p>
        </footer>

    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ
        // ============================================================
        const faqData = [{
            id: 1,
            category: 'price',
            icon: '💸',
            question: 'Почему у тебя такие низкие цены?',
            answer: 'Я начинающий кодер, поэтому пока беру недорого, чтобы наработать опыт и портфолио. Качество при этом не страдает.'
        }, {
            id: 2,
            category: 'price',
            icon: '💳',
            question: 'Как оплачивается работа?',
            answer: 'Предоплата 50% — после утверждения макета. Остальные 50% — после сдачи. Всё прозрачно.'
        }, {
            id: 3,
            category: 'price',
            icon: '📦',
            question: 'Что входит в стоимость?',
            answer: 'Сама работа, одна бесплатная правка, консультация. Хостинг и домен — отдельно.'
        }, {
            id: 4,
            category: 'time',
            icon: '⏳',
            question: 'Долго ли ты делаешь заказ?',
            answer: 'Всё зависит от сложности. Визитка — от пары часов до дня. Лендинг — 2–3 дня. Индивидуально — обсуждаем.'
        }, {
            id: 5,
            category: 'time',
            icon: '🔄',
            question: 'Можно ли что-то поменять после сдачи?',
            answer: 'Да. Одна бесплатная правка в течение 3 дней. Сложные правки — отдельно.'
        }, {
            id: 6,
            category: 'tech',
            icon: '📁',
            question: 'Где будет храниться сайт?',
            answer: 'Хостинг — на GitHub Pages (бесплатно, надёжно) или Vercel (автодеплой, поддержка API). При необходимости могу настроить любой другой хостинг под вашу задачу.'
        }, {
            id: 7,
            category: 'tech',
            icon: '🧩',
            question: 'Что если я ничего не понимаю в сайтах?',
            answer: 'Это нормально. Ты говоришь, что нужно, я делаю. Всё просто.'
        }, {
            id: 8,
            category: 'tech',
            icon: '🔧',
            question: 'Есть ли гарантия на работу?',
            answer: 'Да. Если что-то сломается не по твоей вине — чиню бесплатно.'
        }, {
            id: 9,
            category: 'order',
            icon: '✍️',
            question: 'Как сделать заказ?',
            answer: 'Напиши в Telegram или Discord. Расскажи задачу — я отвечу в течение часа.'
        }, {
            id: 10,
            category: 'order',
            icon: '🔍',
            question: 'Ты делаешь только то, что указано в услугах?',
            answer: 'Нет. Это база. Если у тебя идея, которой нет в списке — напиши, обсудим.'
        }, {
            id: 11,
            category: 'order',
            icon: '🚫',
            question: 'Что ты не делаешь?',
            answer: 'Моя зона — статика, логика на JS и интеграция с API (Telegram, Google Sheets, OpenWeatherMap и т.д). Бэкенд на Node.js через Vercel. Не работаю с Python/Java, CRM, интернет-магазинами и базами данных.'
        }, {
            id: 12,
            category: 'order',
            icon: '🧩',
            question: 'Ты дорабатываешь чужой код?',
            answer: 'Да, но только если у тебя есть права на этот код.'
        }];

        // ============================================================
        //  ЭЛЕМЕНТЫ
        // ============================================================
        const faqList = document.getElementById('faqList');
        const searchInput = document.getElementById('searchInput');
        const categoryTabs = document.querySelectorAll('.category-tab');

        let currentCategory = 'all';
        let searchQuery = '';

        // ============================================================
        //  РЕНДЕРИНГ (с анимацией)
        // ============================================================
        function renderFAQ() {
            const filtered = faqData.filter(item => {
                const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.question.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                   item.answer.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                faqList.innerHTML = `<div class="faq-empty">❌ Ничего не найдено</div>`;
                return;
            }

            // ===== ГЕНЕРАЦИЯ С ЗАДЕРЖКОЙ =====
            faqList.innerHTML = filtered.map((item, index) => `
                <div class="faq-item fade-item" style="animation-delay: ${index * 0.05}s;" data-id="${item.id}">
                    <div class="faq-question">
                        <span class="q-icon">${item.icon}</span>
                        <span class="q-text">${item.question}</span>
                        <span class="q-arrow">▼</span>
                    </div>
                    <div class="faq-answer">${item.answer}</div>
                </div>
            `).join('');

            // ===== ПЕРЕЗАПУСК АНИМАЦИИ =====
            document.querySelectorAll('.faq-item.fade-item').forEach(el => {
                el.style.animation = 'none';
                void el.offsetWidth; // принудительный reflow
                el.style.animation = '';
            });

            // ===== АККОРДЕОН =====
            document.querySelectorAll('.faq-question').forEach(q => {
                q.addEventListener('click', function() {
                    const parent = this.closest('.faq-item');
                    const isActive = parent.classList.contains('active');

                    document.querySelectorAll('.faq-item').forEach(item => {
                        item.classList.remove('active');
                    });

                    if (!isActive) {
                        parent.classList.add('active');
                    }
                });
            });

            // ===== ОТКРЫТЬ ПЕРВЫЙ =====
            const firstItem = document.querySelector('.faq-item');
            if (firstItem && !searchQuery && currentCategory === 'all') {
                firstItem.classList.add('active');
            }
        }

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================

        searchInput.addEventListener('input', function() {
            searchQuery = this.value.trim();
            renderFAQ();
        });

        categoryTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                categoryTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderFAQ();
            });
        });

        // ============================================================
        //  СТАРТ
        // ============================================================
        renderFAQ();
    </script>

</body>
</html>
